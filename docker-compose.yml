# This service is an independent repo. It joins the shared, pre-created
# "microservices-net" network so the frontend (in a different repo/compose
# project) can reach it by container name.
#
# One-time, before the first `up`:
#   docker network create microservices-net
#
# Then from this folder:
#   docker-compose up -d --build

services:
  payment-service:
    build: .
    image: payment-service:local
    container_name: payment-service
    environment:
      PORT: "5000"
      DB_HOST: payment-db
      DB_PORT: "5432"
      DB_USER: payment
      DB_PASSWORD: paymentpass
      DB_NAME: paymentdb
    ports:
      # Optional: host-exposed for direct debugging only. The frontend talks
      # over the shared network, not through this published port.
      - "5000:5000"
    depends_on:
      payment-db:
        condition: service_healthy
      # Do not start the app until schema migrations have been applied.
      migrate:
        condition: service_completed_successfully
    networks:
      - microservices-net
    restart: unless-stopped

  # One-shot migration job: applies any pending SQL migrations in ./db/migrations
  # to payment-db, records them in flyway_schema_history, then exits (Exited 0).
  # It is NOT a long-running service; "Exited (0)" means success.
  migrate:
    image: flyway/flyway:10-alpine
    container_name: payment-migrate
    command: -connectRetries=20 -baselineOnMigrate=true migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://payment-db:5432/paymentdb
      FLYWAY_USER: payment
      FLYWAY_PASSWORD: paymentpass
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - microservices-net
    restart: "no"

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    ports:
      - "5456:5432"
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: paymentpass
      POSTGRES_DB: paymentdb
    volumes:
      - payment-db-data:/var/lib/postgresql/data
      # NOTE: schema/seed is now owned by the Flyway "migrate" service, not by
      # Postgres' docker-entrypoint-initdb.d. The old ./db/init.sql file is kept
      # in the repo for reference but is intentionally no longer mounted here,
      # otherwise it would double-run the seed on first boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net
    restart: unless-stopped

volumes:
  payment-db-data:

networks:
  microservices-net:
    external: true
